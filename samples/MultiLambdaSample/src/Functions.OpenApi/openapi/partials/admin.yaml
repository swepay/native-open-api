openapi: "3.1.0"

info:
  title: "Admin API"
  version: "1.0.0"

x-swepay-error-catalog:
  - code: "USER_ALREADY_EXISTS"
    httpStatus: 409
    userMessage: "Já existe um usuário com o e-mail informado."
    recovery: "Use outro e-mail ou recupere o acesso do usuário existente."
    docUrl: "https://docs.swepay.com.br/errors/USER_ALREADY_EXISTS"
  - code: "USER_NOT_FOUND"
    httpStatus: 404
    userMessage: "Usuário não encontrado para o id informado."
    recovery: "Verifique o id ou consulte GET /v1/admin/users."
    docUrl: "https://docs.swepay.com.br/errors/USER_NOT_FOUND"
  - code: "USER_ROLE_INVALID"
    httpStatus: 422
    userMessage: "O role informado não é válido para esse realm."
    recovery: "Consulte a lista de roles em GET /v1/admin/roles e reenvie a requisição."
    docUrl: "https://docs.swepay.com.br/errors/USER_ROLE_INVALID"

paths:
  /v1/admin/users:
    get:
      operationId: ListAdminUsers
      summary: "Lista usuários administrativos"
      description: "Retorna usuários administrativos e demonstra precedência de fluent metadata sobre atributos"
      tags:
        - Admin
        - Users
      security:
        - JwtBearer: []
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SwepayProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: CreateAdminUser
      summary: "Cria usuário administrativo"
      description: "Cria um usuário com payload JSON e inclui resposta adicional tipada"
      x-swepay-errors:
        - "USER_ROLE_INVALID"
      tags:
        - Admin
        - Users
      security:
        - JwtBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserCommand"
            examples:
              happy-path:
                summary: "Novo usuário com role existente"
                externalValue: "examples/admin/create-user/happy.json"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "422":
          description: "Unprocessable Entity"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SwepayProblemDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/admin/users/{id}:
    delete:
      operationId: DeleteAdminUser
      summary: "Remove usuário"
      description: "Remove um usuário administrativo pelo id"
      tags:
        - Admin
        - Users
      security:
        - JwtBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: ReplaceAdminUserRole
      summary: "Substitui role do usuário"
      description: "Demonstra suporte ao MapPut com request tipado"
      deprecated: true
      x-sunset: "2026-09-30"
      x-swepay-alternative: "PATCH /v1/admin/users/{id}/role"
      x-swepay-deprecation-reason: "PUT overwrote the full user; PATCH is scoped to the role field only."
      tags:
        - Admin
        - Users
      security:
        - JwtBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleCommand"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/admin/users/{id}/role:
    patch:
      operationId: UpdateAdminUserRole
      summary: "Atualiza role do usuário"
      description: "Demonstra suporte ao MapPatch com schema de request/response"
      x-swepay-errors:
        - "USER_ALREADY_EXISTS"
      tags:
        - Admin
        - Users
      security:
        - JwtBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRoleCommand"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRoleResponse"
        "409":
          description: "Conflict"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SwepayProblemDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    CreateUserCommand:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
        displayName:
          type: string
      required:
        - email
        - role
    CreateUserResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    DeleteUserCommand:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    DeleteUserResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    ListUsersCommand:
      type: object
      description: "Request type - properties to be documented"
    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
      required:
        - users
    PatchUserRoleCommand:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
      required:
        - id
        - role
    UpdateUserRoleCommand:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
      required:
        - id
        - role
    UpdateUserRoleResponse:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        message:
          type: string
      required:
        - id
        - role
        - message
    SwepayProblemDetails:
      type: object
      description: "Swepay error payload (RFC 9457 superset). Carries a machine-readable code, UX-written recovery hint and request correlation id."
      properties:
        type:
          type: string
          format: uri
          description: "Canonical documentation URL for this error class."
        title:
          type: string
          description: "Short, human-readable classification."
        status:
          type: integer
          format: int32
          description: "HTTP status code echoed into the body."
        detail:
          type: string
          description: "End-user message. Never contains stack traces or internal identifiers."
        instance:
          type: string
          description: "URI of the specific occurrence (usually the resource path)."
        code:
          type: string
          description: "Machine-readable error code from the Swepay catalog."
        recovery:
          type: string
          description: "Concrete next step the caller should take."
        requestId:
          type: string
          description: "Correlation id, echoed from X-Request-Id when supplied."
      required:
        - type
        - title
        - status
        - detail
        - code
        - recovery
        - requestId
